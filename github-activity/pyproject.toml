[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-activity"
version = "0.1.0"
description = "A CLI tool to fetch and display GitHub user activity in the terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["github", "cli", "activity", "developer-tools"]

[project.scripts]
github-activity = "github_activity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_activity"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]